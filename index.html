<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }
        header {
            background: #1f4e79;
            color: white;
            padding: 22px;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }
        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }
        h2 { margin-bottom: 15px; }
        form {
            display: grid;
            gap: 12px;
        }
        input, button {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            background: #1f4e79;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #eaf1f8;
        }
        .delete {
            background: #c0392b;
            padding: 7px 10px;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .container { width: 94%; }
            table { font-size: 13px; }
            th, td { padding: 7px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Student Management System</h1>
    <p>Java Full Stack Application</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add Student</h2>

        <form id="studentForm">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="course" placeholder="Course" required>
            <button type="submit">Add Student</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="card">
        <h2>Student List</h2>

        <button onclick="loadStudents()">Refresh Students</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr>
                    <td colspan="5">Click Refresh Students</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const API_URL = "http://localhost:8080/students";

    // Load students from Spring Boot backend
    async function loadStudents() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Server error");

            const students = await response.json();
            const table = document.getElementById("studentTable");

            table.innerHTML = "";

            if (students.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="5">No students found</td></tr>';
                return;
            }

            students.forEach(student => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.course}</td>
                    <td>
                        <button class="delete"
                            onclick="deleteStudent(${student.id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });

        } catch (error) {
            document.getElementById("message").textContent =
                "Backend is not running.";
        }
    }

    // Add student
    document.getElementById("studentForm").addEventListener("submit",
        async function(event) {

            event.preventDefault();

            const student = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                course: document.getElementById("course").value
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                if (!response.ok) throw new Error("Unable to add student");

                document.getElementById("message").textContent =
                    "Student added successfully!";

                document.getElementById("studentForm").reset();

                loadStudents();

            } catch (error) {
                document.getElementById("message").textContent =
                    "Could not connect to backend.";
            }
        });

    // Delete student
    async function deleteStudent(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) throw new Error("Delete failed");

            loadStudents();

        } catch (error) {
            document.getElementById("message").textContent =
                "Could not delete student.";
        }
    }
</script>

</body>
</html>
